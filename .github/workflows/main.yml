name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 1.3.0；留空则用 0.0.0-dev）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build / Package / Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version) -and $env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "0.0.0-dev" }
          $version = $version.Trim().TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Build version: $version"

      - name: Stamp assembly version
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          if ($version -match '^\d+\.\d+\.\d+$') {
            $fileVersion = "$version.0"
          } elseif ($version -match '^\d+\.\d+\.\d+\.\d+$') {
            $fileVersion = $version
          } else {
            Write-Host "Skip stamping for non-numeric version: $version"
            exit 0
          }
          $path = "CampusLink/Properties/AssemblyInfo.cs"
          $content = Get-Content $path -Raw
          $content = $content -replace 'AssemblyVersion\("[^"]+"\)', "AssemblyVersion(""$fileVersion"")"
          $content = $content -replace 'AssemblyFileVersion\("[^"]+"\)', "AssemblyFileVersion(""$fileVersion"")"
          Set-Content -Path $path -Value $content -Encoding UTF8
          Write-Host "AssemblyVersion -> $fileVersion"

      - name: Restore
        run: msbuild CampusLink/CampusLink.csproj -t:Restore -p:Configuration=Release -v:m

      - name: Build
        run: msbuild CampusLink/CampusLink.csproj -t:Build -p:Configuration=Release -v:m

      - name: Stage files and create update zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $stage = "dist/CampusLink-$version"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Get-ChildItem "CampusLink/bin/Release" -File |
            Where-Object { $_.Extension -ne '.pdb' } |
            Copy-Item -Destination $stage -Force
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/CampusLink-$version-win.zip" -CompressionLevel Optimal
          Get-ChildItem "dist" -File | Select-Object Name, Length

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          Write-Host "ISCC: $(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')"

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $source = (Resolve-Path "dist/CampusLink-$version").Path
          & $iscc "/DAppVersion=$version" "/DSourceDir=$source" "installer/CampusLink.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          Get-ChildItem "dist" -File | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CampusLink-${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/*Setup*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*Setup*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
